
<!DOCTYPE html>
<html>
<head>
    <title>Event Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>College Event Explorer</h1>
    <p>Explore Upcoming Events</p>
</header>

<div class="container">

    <input type="text" id="search"
    placeholder="Search events by name..."
    oninput="displayEvents()">

    <select id="category" onchange="displayEvents()">
        <option value="All">All Categories</option>
        <option value="Technical">Technical</option>
        <option value="Cultural">Cultural</option>
        <option value="Sports">Sports</option>
    </select>

    <input type="date" id="eventDate"
    onchange="displayEvents()">

    <select id="sort" onchange="displayEvents()">
        <option value="default">Default Order</option>
        <option value="name">Sort by Name</option>
        <option value="date">Sort by Date</option>
    </select>

    <div id="events" class="events"></div>

    <h2 id="noResult"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
